protocol_version: "0.3"
id: dev.seedspec.authoring-system
name: SeedSpec Authoring System
version: 0.3.0
kind: solution
description: A shared headless engine, CLI, and web workbench for producing reviewable, portable SeedSpec packages from source intent.
definition:
  module: primary-intent

context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: solution.md
      source:
        kind: package
        path: definition/solution.md
configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
provides:
  capabilities: []
components:
  acceptance: acceptance/
