authoring_state_version: "0.2"
sources:
  - id: shared-authoring-engine-decision
    kind: decision-record
    location: https://github.com/SeedSpec/seedspec/blob/main/docs/decisions/0013-shared-authoring-engine-and-frontend-contract.md
    authority: package-author-confirmed
    use: Primary source for the engine, CLI, web-frontend, parity, and delivery boundaries captured in this package.
  - id: deep-authoring-session
    kind: author-conversation
    location: private-session
    authority: package-author
    use: Origin of the request to clarify the authoring product and keep CLI and web workflows in parity while testing real authorship.
  - id: configuration-examples-are-not-defaults
    kind: decision-record
    location: https://github.com/SeedSpec/seedspec/blob/main/docs/decisions/0005-explicit-configuration-selection.md
    authority: protocol-normative-rationale
    use: >-
      Establishes that a package configuration example is required author-supplied
      material and never a user-selected default. Consulted in pass
      0004-decision-provenance to classify the influence of
      configuration/example.yaml.
  - id: authoring-target-vocabulary
    kind: implementation-artifact
    location: seedspec/packages/runtime/src/authoring.js
    authority: protocol-implementation
    use: >-
      Confirms that the authoring depth vocabulary and the seven review areas are
      frozen in the protocol runtime rather than defined by this package. Read
      from a local checkout in pass 0004-decision-provenance.
notes: >-
  Decision record 0013 and 0005 were read from the local SeedSpec repository
  checkout rather than fetched over the network. No external fetch was performed
  during authoring.
