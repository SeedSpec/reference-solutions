summary: The workflow establishes participants, authority, scheduled stages, profile selection, failure handling, and completion evidence. The source population and event-time semantics for the daily average are materially missing.
findings:
  - id: workflow-lens-core
    source: definition/solution.md; acceptance/criteria.md
    assessment: HubSpot administration, Slack authorization, schedule ownership, previous-day delivery, idempotent reconciliation, retries, and evidence are established.
    consequence: The workflow boundaries and consequential authority are visible to an implementation agent.
    recommendation: Preserve the current workflow and configured-system framing.
    status: established
  - id: metric-population-and-time-axis
    source: definition/solution.md#daily-workflow
    assessment: The package does not define which records enter the daily average or which record timestamp assigns values to the previous calendar day.
    consequence: Different faithful-looking implementations can report materially different sales metrics.
    recommendation: Require the author to define the population, filters, value semantics, and event-time field.
    status: materially-missing
