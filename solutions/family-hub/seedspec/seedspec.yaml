protocol_version: "0.3"
id: org.seedspec.examples.family-hub
name: Family Hub
version: "0.3.0"
kind: application
description: Coordinate a household's shared events and tasks, with optional allowance tracking and meal planning.

metadata:
  license: Apache-2.0

definition:
  module: primary-intent

context:
  modules:
    - id: primary-intent
      format: org.seedspec.intent.markdown
      description: The package author's primary intent.
      entrypoint: family-hub.md
      source:
        kind: package
        path: definition/family-hub.md

configuration:
  schema: configuration/schema.json
  example: configuration/example.yaml
  guide: configuration/guide.md

provides:
  capabilities:
    - id: org.seedspec.examples.family-coordination
      version: 1.0.0
      contract: capabilities/family-coordination.md

components:
  acceptance: acceptance/

extensions:
  org.seedspec.examples.catalog:
    audience: families
    demonstrates:
      - configurable-application
      - optional-modules
      - multi-role-permissions
