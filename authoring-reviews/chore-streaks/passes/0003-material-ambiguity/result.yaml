outcome: completed
summary: "Two material interpretations remain unclear: the exact effect of hiding longest streak and whether a late approval may add a historical qualifying event after its owner is archived."
findings:
  - id: show-longest-semantics
    source: configuration/example.yaml#show_longest
    assessment: The package does not say whether false suppresses presentation only or eliminates calculation and capability availability.
    consequence: Consumers may receive different capability behavior under the same configuration.
    recommendation: Prefer presentation-only suppression so deterministic historical reconstruction remains available, but require author confirmation.
    status: deferred
  - id: archived-owner-late-approval
    source: definition/feature.md#business-rules
    assessment: Archived actors do not accumulate new qualifying events, but the package does not distinguish newly performed work from a late approval or correction of work completed before archival.
    consequence: Historical streaks may diverge depending on processing order.
    recommendation: Define whether qualification follows the effective work event time rather than the time approval is processed.
    status: deferred
