summary: Core intent, configuration, acceptance, capability contracts, and the optional ProductSpec are generally well separated. Recurring base allowance is the one material concern whose classification remains unclear because it is configurable but otherwise largely unspecified.
findings:
  - id: recurring-allowance-scope
    source: configuration/example.yaml#recurring_allowance; definition/app.md#configuration-behavior
    assessment: Recurring base allowance is presented as product configuration, but the package does not define its transaction behavior, scheduling edge cases, failure behavior, or acceptance. It may be under-specified core behavior or a separately composable addition.
    consequence: Implementing agents must invent consequential accounting and scheduling behavior or may omit a selected configuration entirely.
    recommendation: Confirm whether recurring base allowance belongs to the core application. If it does, shape and harden it; otherwise remove it from core configuration and package it separately later.
    status: needs-author
