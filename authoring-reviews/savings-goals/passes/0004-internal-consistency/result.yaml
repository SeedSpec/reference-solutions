summary: The audit aligned tracked-mode records, overfunding, completion disposition, reverse transitions, active-goal limits, capability language, and acceptance. Deletion-fund option semantics remain unresolved.
findings:
  - id: tracked-mode-transaction-conflict
    source: definition/feature.md#allocate-value; capabilities/goal-allocations.md
    assessment: Tracked progress previously required a transaction while promising no balance change.
    consequence: Hosts could misrepresent intent as a balance mutation.
    recommendation: Use an attributed goal-allocation record and reserve host balance transactions for actual balance or availability effects.
    status: resolved
  - id: reached-state-reversal
    source: definition/feature.md#state-model
    assessment: The prose permitted one reached-to-active path while omitting the equivalent withdrawal path and diagram edge.
    consequence: Equivalent progress changes could produce inconsistent state.
    recommendation: Define both paths through the progress invariant.
    status: resolved
  - id: deletion-funds-still-unclear
    source: configuration/schema.json#deletion_funds
    assessment: Return available and transfer to balance still lack distinct transaction-level meanings.
    consequence: Deletion or archival accounting remains non-portable.
    recommendation: Require author resolution before calling package hardening complete.
    status: open
